<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Привычки">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Привычки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe6; --paper:#fffaf3; --ink:#1f1b16; --muted:#8a8076; --line:#e8dfd2;
  --empty:#efe7db; --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
body{min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
body{overscroll-behavior-y:none}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:38px;letter-spacing:-.02em;margin:0;line-height:1}
.date{color:var(--muted);font-size:14px;margin-top:8px;text-transform:lowercase}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.ring .lbl small{font-weight:600;font-size:8.5px;color:var(--muted);letter-spacing:.02em}
.quote{font-family:Fraunces,Georgia,serif;font-style:italic;color:var(--muted);font-size:15px;margin:-6px 0 20px}

.weekbar{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;gap:6px;margin-bottom:10px}
.navbtn{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;height:28px;border-radius:8px}
.navbtn:hover{background:var(--empty)}
.navbtn:disabled{opacity:.25;cursor:default;background:transparent}
.weektitle{text-align:center;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.03em}

.card{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:16px 16px 14px;margin-bottom:12px;border:1px solid rgba(0,0,0,.02);transition:transform .15s}
.top{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.emoji{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.name{font-weight:700;font-size:16px;line-height:1.2}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px}
.meta b{color:var(--ink);font-weight:600}
.chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:14px}
.card.open .chev{transform:rotate(180deg)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px}
.dl{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.dl.today{color:var(--ink)}
.cell{width:100%;aspect-ratio:1;max-width:46px;border-radius:13px;border:0;background:var(--empty);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);transition:transform .12s, background .2s}
.cell:active{transform:scale(.9)}
.cell.on{color:#fff}
.cell.on::after{content:"✓";font-size:17px}
.cell.on span{display:none}
.cell.future{opacity:.35;cursor:default}
.cell.istoday{outline:2px solid var(--ink);outline-offset:2px}

.more{display:none;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.card.open .more{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat .v{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:600;line-height:1}
.stat .k{font-size:11px;color:var(--muted);margin-top:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.hc{width:13px;height:13px;border-radius:4px;background:var(--empty)}
.hc.f{background:transparent}
.heatlbl{font-size:11px;color:var(--muted);margin:0 0 8px}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 13px Manrope,sans-serif;cursor:pointer;background:var(--bg);color:var(--ink)}
.btn.danger{color:#b4442f}
.btn.primary{background:var(--ink);color:var(--paper)}

.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
.empty .big{font-family:Fraunces,serif;font-size:24px;color:var(--ink);margin-bottom:6px}

.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(26px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--ink);color:var(--paper);font-size:30px;cursor:pointer;box-shadow:0 10px 30px rgba(30,20,10,.25);transition:transform .15s}
.fab:active{transform:scale(.92)}

.scrim{position:fixed;inset:0;background:rgba(30,22,14,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-family:Fraunces,serif;font-weight:600;margin:0 0 16px;font-size:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px;letter-spacing:.03em;text-transform:uppercase}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;font:500 16px Manrope,sans-serif;color:var(--ink);outline:none}
.field input:focus{border-color:var(--ink)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{width:42px;height:42px;border-radius:13px;border:2px solid transparent;background:var(--bg);font-size:20px;cursor:pointer}
.pick button.sel{border-color:var(--ink)}
.pick.colors button{border-radius:50%;width:36px;height:36px}
.pick.colors button.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink);border-color:transparent}
.sheet .actions{justify-content:flex-end;margin-top:6px}
.confirm{display:none;background:#fbeee9;border-radius:14px;padding:12px;margin-top:12px;font-size:13px}
.confirm.show{display:block}
.backup{display:flex;gap:8px;justify-content:center;margin-top:28px}
.backup .btn{background:transparent;color:var(--muted);font-weight:500}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:.92}
</style>
</head>
<body>
<div id="app"></div>
<script id="state" type="application/json">{"habits":[{"id":"h1","name":"Французский — 20 минут","emoji":"🇫🇷","color":"#3d6fb6","done":[]},{"id":"h2","name":"Чтение","emoji":"📖","color":"#c2703d","done":[]},{"id":"h3","name":"Прогулка у моря","emoji":"🌊","color":"#2f9c95","done":[]},{"id":"h4","name":"Без телефона перед сном","emoji":"🌙","color":"#7a5bb5","done":[]}]}</script>
<script id="appcode">
(function(){
let state;
try{ state = JSON.parse(document.getElementById('state').textContent); }catch(e){ state={habits:[]}; }

const EMOJIS=['🇫🇷','📖','🌊','🌙','🏃','🧘','💧','🥗','📷','🎨','✍️','🎧','🏛️','🍷','🛏️','💪','🚶','🧠','☕','🌿'];
const COLORS=['#3d6fb6','#c2703d','#2f9c95','#7a5bb5','#d0556b','#5f8f3a','#c9a227','#3b3a36'];
const WD=['пн','вт','ср','чт','пт','сб','вс'];
const QUOTES=['Маленькие шаги каждый день.','Не разрывай цепочку.','Сегодня — лучший день, чтобы начать.','Повторение — мать учения.','Делай, даже когда не хочется.'];

const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=new Date(); today.setHours(0,0,0,0);
const TK=key(today);
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
let weekOffset=0, openId=null, editId=null;

// --- persistence ---
const LS='habit-tracker-v1';
try{const saved=JSON.parse(localStorage.getItem(LS)); if(saved&&Array.isArray(saved.habits)) state=saved;}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){toast('Не удалось сохранить');}}
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  const name='privychki-'+TK+'.json';
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Резервная копия привычек'}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function importData(f){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!Array.isArray(d.habits)) throw 0; state=d; save(); render(); toast('Данные восстановлены');}catch(e){toast('Это не файл копии');}};
  r.readAsText(f);
}

// --- stats ---
function streak(h){
  const set=new Set(h.done); let d=new Date(today); if(!set.has(key(d))) d=addDays(d,-1);
  let n=0; while(set.has(key(d))){n++; d=addDays(d,-1);} return n;
}
function best(h){
  const ds=[...h.done].sort(); let b=0,c=0,prev=null;
  for(const s of ds){const d=new Date(s+'T00:00:00'); c=(prev&&key(addDays(prev,1))===s)?c+1:1; b=Math.max(b,c); prev=d;}
  return b;
}
function rate30(h){const set=new Set(h.done);let n=0;for(let i=0;i<30;i++) if(set.has(key(addDays(today,-i)))) n++;return Math.round(n/30*100);}
function plural(n,a,b,c){const m=n%10,h=n%100;return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<12||h>14))?b:c;}

// --- render ---
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tint(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}

function render(){
  const total=state.habits.length, doneToday=state.habits.filter(h=>h.done.includes(TK)).length;
  const pct=total?doneToday/total:0, C=2*Math.PI*32;
  const dateStr=today.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const mon=addDays(mondayOf(today),weekOffset*7), sun=addDays(mon,6);
  const fmt=d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','');
  const weekTitle=weekOffset===0?'Эта неделя':fmt(mon)+' — '+fmt(sun);
  const q=QUOTES[today.getDate()%QUOTES.length];

  let html=`<div class="wrap">
  <header><div><h1>Привычки</h1><div class="date">${dateStr}</div></div>
   <div class="ring"><svg width="76" height="76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--empty)" stroke-width="8"/>
   <circle cx="38" cy="38" r="32" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .5s"/></svg>
   <div class="lbl">${doneToday}/${total}<small>СЕГОДНЯ</small></div></div></header>
  <p class="quote">${pct===1&&total?'Всё сделано — красота! ✨':q}</p>`;

  if(!total){
    html+=`<div class="empty"><div class="big">Пока пусто</div>Нажмите «+», чтобы добавить первую привычку</div>`;
  }else{
    html+=`<div class="weekbar"><button class="navbtn" data-nav="-1">‹</button><div class="weektitle">${weekTitle}</div><button class="navbtn" data-nav="1" ${weekOffset>=0?'disabled':''}>›</button></div>`;
    for(const h of state.habits){
      const set=new Set(h.done), st=streak(h);
      html+=`<div class="card ${openId===h.id?'open':''}" data-id="${h.id}">
       <div class="top" data-toggle="${h.id}"><div class="emoji" style="background:${tint(h.color,.14)}">${esc(h.emoji)}</div>
        <div><div class="name">${esc(h.name)}</div><div class="meta"><span>🔥 <b>${st}</b> ${plural(st,'день','дня','дней')} подряд</span></div></div>
        <div class="chev">▾</div></div>
       <div class="days">`;
      for(let i=0;i<7;i++){
        const d=addDays(mon,i), k=key(d), fut=d>today, on=set.has(k);
        html+=`<div class="day"><div class="dl ${k===TK?'today':''}">${WD[i]}</div>
         <button class="cell ${on?'on':''} ${fut?'future':''} ${k===TK?'istoday':''}" ${fut?'disabled':''} data-hit="${h.id}|${k}" style="${on?'background:'+h.color:''}"><span>${d.getDate()}</span></button></div>`;
      }
      html+=`</div><div class="more">
        <div class="stats"><div class="stat"><div class="v">${best(h)}</div><div class="k">лучшая серия</div></div>
        <div class="stat"><div class="v">${rate30(h)}%</div><div class="k">за 30 дней</div></div>
        <div class="stat"><div class="v">${h.done.length}</div><div class="k">всего раз</div></div></div>
        <p class="heatlbl">Последние 4 месяца</p><div class="heat">`;
      const start=addDays(mondayOf(today),-7*17);
      for(let i=0;i<18*7;i++){const d=addDays(start,i),k=key(d);
        html+= d>today?`<div class="hc f"></div>`:`<div class="hc" title="${k}" style="${set.has(k)?'background:'+h.color:''}"></div>`;}
      html+=`</div><div class="actions"><button class="btn" data-edit="${h.id}">Изменить</button>
        <button class="btn" data-up="${h.id}">↑ Выше</button></div></div></div>`;
    }
  }
  html+=`<div class="backup"><button class="btn" data-export>⤓ Сохранить копию</button><button class="btn" data-import>⤒ Восстановить</button><input type="file" id="imp" accept="application/json,.json" hidden></div>`;
  html+=`</div><button class="fab" data-add aria-label="Добавить привычку">+</button>
  <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>`;
  app.innerHTML=html;
}

function toast(t){const el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}

// --- sheet ---
let draft=null;
function openSheet(id){
  editId=id||null;
  const h=id?state.habits.find(x=>x.id===id):null;
  draft={name:h?h.name:'',emoji:h?h.emoji:EMOJIS[4],color:h?h.color:COLORS[state.habits.length%COLORS.length]};
  drawSheet(); document.getElementById('scrim').classList.add('show');
  setTimeout(()=>{const i=document.getElementById('nm'); if(i&&!id) i.focus();},50);
}
function drawSheet(){
  const s=document.getElementById('sheet');
  s.innerHTML=`<h2>${editId?'Изменить привычку':'Новая привычка'}</h2>
   <div class="field"><label>Название</label><input id="nm" maxlength="60" placeholder="Например, медитация 10 минут" value="${esc(draft.name)}"></div>
   <div class="field"><label>Иконка</label><div class="pick">${EMOJIS.map(e=>`<button data-em="${e}" class="${e===draft.emoji?'sel':''}">${e}</button>`).join('')}</div></div>
   <div class="field"><label>Цвет</label><div class="pick colors">${COLORS.map(c=>`<button data-co="${c}" class="${c===draft.color?'sel':''}" style="background:${c}"></button>`).join('')}</div></div>
   <div class="actions">${editId?'<button class="btn danger" data-del style="margin-right:auto">Удалить</button>':''}
    <button class="btn" data-close>Отмена</button><button class="btn primary" data-save>Сохранить</button></div>
   <div class="confirm" id="cf">Удалить привычку и всю её историю?
    <div class="actions" style="justify-content:flex-start"><button class="btn danger" data-delyes>Да, удалить</button><button class="btn" data-delno>Нет</button></div></div>`;
  s.querySelector('#nm').addEventListener('input',e=>draft.name=e.target.value);
}
function closeSheet(){document.getElementById('scrim').classList.remove('show');}

// --- events ---
app.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-toggle],.scrim'); if(!t) return;
  if(t.id==='scrim'&&e.target===t){closeSheet();return;}
  const d=t.dataset;
  if(d.hit){const [id,k]=d.hit.split('|');const h=state.habits.find(x=>x.id===id);
    const i=h.done.indexOf(k); if(i>=0) h.done.splice(i,1); else h.done.push(k);
    render(); save(); return;}
  if(d.toggle){openId=openId===d.toggle?null:d.toggle;render();return;}
  if(d.nav){weekOffset=Math.min(0,weekOffset+Number(d.nav));render();return;}
  if('add' in d){openSheet();return;}
  if('export' in d){exportData();return;}
  if('import' in d){document.getElementById('imp').click();return;}
  if(d.edit){openSheet(d.edit);return;}
  if(d.up){const i=state.habits.findIndex(x=>x.id===d.up); if(i>0){const [h]=state.habits.splice(i,1);state.habits.splice(i-1,0,h);render();save();}return;}
  if(d.em){draft.emoji=d.em;drawSheet();return;}
  if(d.co){draft.color=d.co;drawSheet();return;}
  if('close' in d){closeSheet();return;}
  if('del' in d){document.getElementById('cf').classList.add('show');return;}
  if('delno' in d){document.getElementById('cf').classList.remove('show');return;}
  if('delyes' in d){state.habits=state.habits.filter(x=>x.id!==editId);openId=null;closeSheet();render();save();return;}
  if('save' in d){
    const name=draft.name.trim(); if(!name){document.getElementById('nm').focus();return;}
    if(editId){Object.assign(state.habits.find(x=>x.id===editId),{name,emoji:draft.emoji,color:draft.color});}
    else state.habits.push({id:'h'+Date.now().toString(36),name,emoji:draft.emoji,color:draft.color,done:[]});
    closeSheet();render();save();return;}
});
app.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files[0]) importData(e.target.files[0]);});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){e.preventDefault();app.querySelector('[data-save]').click();}});
render();
})();
</script>
</body>
</html>
